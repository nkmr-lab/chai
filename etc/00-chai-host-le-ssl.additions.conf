# C:\Dropbox\Programs\Claude\chai\etc\00-chai-host-le-ssl.additions.conf
#   /etc/httpd/conf.d/00-chai-host-le-ssl.conf の <VirtualHost> の中に足す分。
#   docroot が chai の置き場そのものなので、 外から触れて良いものを絞る必要がある。

  # 中身 (テスト / 部品 / 設定 / 定義) は外から触らせない。
  # tests/ は本番でも動いてしまう口 (偽 OpenAI・DB を消すテスト) なので特に。
  <DirectoryMatch "^/var/www/chai/(tests|lib|handlers)(/|$)">
    Require all denied
  </DirectoryMatch>
  <FilesMatch "^(config\.local\.php|config\.sample\.php|db\.php|lib\.php|nkmrauth\.php|schema\.sql|.*\.md)$">
    Require all denied
  </FilesMatch>
  Options -Indexes

  # 生成物 (画像・分析の出力) はログインした人にだけ渡す。
  # 名前は当てにくいが、 分析の出力には研究データが入りうるので当てにくさに頼らない。
  RewriteEngine On
  RewriteRule ^/media/([A-Za-z0-9._-]+)$ /media.php?f=$1 [L,QSA]

  # 素性は名乗らない
  Header always unset X-Powered-By
  Header always set X-Content-Type-Options "nosniff"
  Header always set Referrer-Policy "same-origin"
  Header always set Strict-Transport-Security "max-age=15552000"
